[project]
name = "prettyjoey"
version = "0.1.6"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "prettyjoey", email = "prettyjoey46@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "onnx>=1.23.2",
    "onnxruntime>=1.32.0",
    "onnxscript>=0.7.2",
    "pandas>=3.1.0",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "torch>=2.15.0",
]

[tool.maturin]
module-name = "prettyjoey._core"
python-packages = ["prettyjoey"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin>=1.14.1",
]
